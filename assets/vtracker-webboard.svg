<svg viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System telemetry — web traversal signal, live">
  <defs>
    <pattern id="wbGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="110" rx="10" fill="#0b0b0e"/>
  <rect width="1200" height="110" rx="10" fill="url(#wbGrid)"/>
  <rect width="1200" height="110" rx="10" fill="none" stroke="#232329"/>

  <g font-family="'JetBrains Mono',Consolas,monospace">
    <text x="40" y="42" font-size="13" letter-spacing="3" fill="#ff1f3d">SYSTEM TELEMETRY</text>
    <text x="40" y="60" font-size="10.5" letter-spacing="1.5" fill="#58585f">WEB TRAVERSAL SIGNAL — LIVE, PULLED FROM GITHUB</text>
  </g>

  <!-- self-contained thread the crawler travels along, no external resources -->
  <path id="crawlPath2" d="M60,80 C 300,60 500,95 700,68 S 1000,55 1140,80" fill="none" stroke="#ff1f3d" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="1 6"/>

  <g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#crawlPath2"/>
    </animateMotion>
    <g stroke="#ff1f3d" stroke-width="1.3" fill="none" opacity="0.95">
      <line x1="0" y1="0" x2="-9" y2="-7"/>
      <line x1="0" y1="0" x2="-11" y2="-1"/>
      <line x1="0" y1="0" x2="-9" y2="6"/>
      <line x1="0" y1="0" x2="9" y2="-7"/>
      <line x1="0" y1="0" x2="11" y2="-1"/>
      <line x1="0" y1="0" x2="9" y2="6"/>
    </g>
    <ellipse cx="0" cy="0" rx="4.6" ry="3.4" fill="#ff1f3d"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#ff1f3d" stroke-opacity="0.4">
      <animate attributeName="r" values="9;15;9" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="1160" y="98" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" letter-spacing="1.5" fill="#58585f">● TRACING ACTIVITY</text>
</svg>
