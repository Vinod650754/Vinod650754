<svg viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project sightings — status legend: confirmed active, developing, experimental, archived or hackathon">
  <defs>
    <linearGradient id="shScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff1f3d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="shGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="110" rx="10" fill="#0b0b0e"/>
  <rect width="1200" height="110" rx="10" fill="url(#shGrid)"/>
  <rect width="1200" height="110" rx="10" fill="none" stroke="#232329"/>
  <rect x="-160" y="0" width="160" height="110" fill="url(#shScan)">
    <animate attributeName="x" values="-160;1200" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'JetBrains Mono',Consolas,monospace">
    <g transform="translate(40,40)" stroke="#ff1f3d" fill="none">
      <circle r="13" stroke-opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </circle>
      <line x1="0" y1="-18" x2="0" y2="-13"/><line x1="0" y1="13" x2="0" y2="18"/>
      <line x1="-18" y1="0" x2="-13" y2="0"/><line x1="18" y1="0" x2="13" y2="0"/>
      <circle r="2.5" fill="#ff1f3d" stroke="none"/>
    </g>
    <text x="66" y="34" font-size="13" letter-spacing="3" fill="#ff1f3d">PROJECT SIGHTINGS</text>
    <text x="66" y="52" font-size="10.5" letter-spacing="1.5" fill="#58585f">EVERY BUILD ON RECORD, TAGGED BY STATUS</text>

    <g font-size="11.5">
      <circle cx="66" cy="82" r="5" fill="#21c979"/><text x="80" y="86" fill="#c9c9cf">CONFIRMED / ACTIVE</text>
      <circle cx="286" cy="82" r="5" fill="#ffb020"/><text x="300" y="86" fill="#c9c9cf">DEVELOPING</text>
      <circle cx="440" cy="82" r="5" fill="#3aa0ff"/><text x="454" y="86" fill="#c9c9cf">EXPERIMENTAL</text>
      <circle cx="610" cy="82" r="5" fill="#58585f"/><text x="624" y="86" fill="#c9c9cf">ARCHIVED / HACKATHON</text>
    </g>
  </g>
</svg>
