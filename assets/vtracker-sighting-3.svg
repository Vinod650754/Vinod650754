<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sighting 003 — Spandana Website, production, version 1">
  <defs>
    <pattern id="s3Grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="10" fill="#0b0b0e"/>
  <rect width="1200" height="340" rx="10" fill="url(#s3Grid)"/>

  <g stroke="#ff1f3d" fill="none" opacity="0.6">
    <circle cx="120" cy="170" r="90" stroke-opacity="0.05"/>
    <circle cx="120" cy="170" r="150" stroke-opacity="0.04"/>
  </g>

  <rect width="1200" height="340" rx="10" fill="none" stroke="#232329"/>
  <rect x="0" y="0" width="5" height="340" fill="#21c979"/>

  <polygon points="1200,0 1200,150 1050,0" fill="#21c979"/>
  <text x="1130" y="52" transform="rotate(45,1130,52)" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#0b0b0e">PRODUCTION</text>

  <g font-family="'JetBrains Mono',Consolas,monospace">
    <g transform="translate(58,48)" stroke="#ff1f3d" fill="none">
      <circle r="15" stroke-opacity="0.5">
        <animate attributeName="r" values="15;19;15" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0.2;0.55" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.8" fill="#ff1f3d" stroke="none"/>
      <line x1="0" y1="-21" x2="0" y2="-15"/><line x1="0" y1="15" x2="0" y2="21"/>
      <line x1="-21" y1="0" x2="-15" y2="0"/><line x1="21" y1="0" x2="15" y2="0"/>
    </g>
    <text x="86" y="40" font-size="11.5" letter-spacing="2" fill="#58585f">SIGHTING 003 · VERSION 1</text>
    <text x="86" y="68" font-size="26" font-weight="700" fill="#f2f2f4">SPANDANA WEBSITE</text>

    <g transform="translate(86,92)">
      <rect width="132" height="24" rx="12" fill="none" stroke="#ff1f3d" stroke-opacity="0.5"/>
      <text x="66" y="16" text-anchor="middle" font-size="11" letter-spacing="1" fill="#ff1f3d">FULL-STACK</text>
    </g>
    <g transform="translate(226,92)">
      <rect width="84" height="24" rx="12" fill="none" stroke="#ff1f3d" stroke-opacity="0.5"/>
      <text x="42" y="16" text-anchor="middle" font-size="11" letter-spacing="1" fill="#ff1f3d">CMS</text>
    </g>
    <g transform="translate(318,92)">
      <rect width="192" height="24" rx="12" fill="none" stroke="#ff1f3d" stroke-opacity="0.5"/>
      <text x="96" y="16" text-anchor="middle" font-size="11" letter-spacing="1" fill="#ff1f3d">SOCIAL OUTREACH</text>
    </g>

    <line x1="58" y1="140" x2="1160" y2="140" stroke="#232329"/>

    <text x="58" y="168" font-size="11.5" letter-spacing="2" fill="#ff1f3d">OBJECTIVE</text>
    <text x="58" y="190" font-size="13" fill="#e8e8ea">Official platform for the Spandana Social Outreach Club at Sir MVIT — CMS-driven,</text>
    <text x="58" y="210" font-size="13" fill="#e8e8ea">built to manage and showcase events, registrations, gallery, team and community work.</text>

    <text x="58" y="244" font-size="11.5" letter-spacing="2" fill="#ff1f3d">DETECTED CAPABILITIES</text>

    <g font-size="12" fill="#c9c9cf">
      <g transform="translate(58,268)"><rect width="147" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="73.5" y="17" text-anchor="middle">Event management</text></g>
      <g transform="translate(217,268)"><rect width="133" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="66.5" y="17" text-anchor="middle">Dynamic gallery</text></g>
      <g transform="translate(362,268)"><rect width="119" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="59.5" y="17" text-anchor="middle">Registrations</text></g>
      <g transform="translate(493,268)"><rect width="133" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="66.5" y="17" text-anchor="middle">Admin dashboard</text></g>
    </g>
  </g>

  <g font-family="'JetBrains Mono',Consolas,monospace" transform="translate(0,0)">
    <rect x="58" y="304" width="4" height="20" fill="#ff1f3d"/>
    <text x="74" y="318" font-size="12" fill="#9a9aa2"><tspan fill="#ff1f3d">BEST FEATURE</tspan> — admins update content through the CMS without touching source code.</text>
  </g>
</svg>
