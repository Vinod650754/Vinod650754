<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sighting 002 — Question For The Day, confirmed and active, version 1">
  <defs>
    <pattern id="s2Grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="10" fill="#0b0b0e"/>
  <rect width="1200" height="400" rx="10" fill="url(#s2Grid)"/>

  <g stroke="#ff1f3d" fill="none" opacity="0.6">
    <circle cx="120" cy="200" r="90" stroke-opacity="0.05"/>
    <circle cx="120" cy="200" r="150" stroke-opacity="0.04"/>
  </g>

  <rect width="1200" height="400" rx="10" fill="none" stroke="#232329"/>
  <rect x="0" y="0" width="5" height="400" fill="#21c979"/>

  <polygon points="1200,0 1200,150 1050,0" fill="#21c979"/>
  <text x="1130" y="52" transform="rotate(45,1130,52)" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#0b0b0e">CONFIRMED · V1</text>

  <g font-family="'JetBrains Mono',Consolas,monospace">
    <g transform="translate(58,48)" stroke="#ff1f3d" fill="none">
      <circle r="15" stroke-opacity="0.5">
        <animate attributeName="r" values="15;19;15" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0.2;0.55" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.8" fill="#ff1f3d" stroke="none"/>
      <line x1="0" y1="-21" x2="0" y2="-15"/><line x1="0" y1="15" x2="0" y2="21"/>
      <line x1="-21" y1="0" x2="-15" y2="0"/><line x1="21" y1="0" x2="15" y2="0"/>
    </g>
    <text x="86" y="40" font-size="11.5" letter-spacing="2" fill="#58585f">SIGHTING 002</text>
    <text x="86" y="68" font-size="26" font-weight="700" fill="#f2f2f4">QUESTION FOR THE DAY (QFAD)</text>

    <g transform="translate(86,92)">
      <rect width="132" height="24" rx="12" fill="none" stroke="#ff1f3d" stroke-opacity="0.5"/>
      <text x="66" y="16" text-anchor="middle" font-size="11" letter-spacing="1" fill="#ff1f3d">FULL-STACK</text>
    </g>
    <g transform="translate(226,92)">
