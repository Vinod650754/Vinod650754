      <text x="96" y="16" text-anchor="middle" font-size="11" letter-spacing="1" fill="#ff1f3d">ADAPTIVE LEARNING</text>
    </g>

    <line x1="58" y1="140" x2="1160" y2="140" stroke="#232329"/>

    <text x="58" y="168" font-size="11.5" letter-spacing="2" fill="#ff1f3d">OBJECTIVE</text>
    <text x="58" y="190" font-size="13" fill="#e8e8ea">A production-ready adaptive learning platform — daily questions, AI-recommended</text>
    <text x="58" y="210" font-size="13" fill="#e8e8ea">follow-ups, XP, streaks and leaderboards, with a full admin layer behind it.</text>

    <text x="58" y="244" font-size="11.5" letter-spacing="2" fill="#ff1f3d">DETECTED CAPABILITIES</text>

    <g font-size="12" fill="#c9c9cf">
      <g transform="translate(58,268)"><rect width="196" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="98" y="17" text-anchor="middle">Daily question delivery</text></g>
      <g transform="translate(266,268)"><rect width="203" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="101.5" y="17" text-anchor="middle">AI-recommended questions</text></g>
      <g transform="translate(481,268)"><rect width="189" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="94.5" y="17" text-anchor="middle">XP and streak tracking</text></g>
      <g transform="translate(682,268)"><rect width="189" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="94.5" y="17" text-anchor="middle">topic mastery tracking</text></g>
      <g transform="translate(883,268)"><rect width="112" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="56" y="17" text-anchor="middle">leaderboards</text></g>

      <g transform="translate(58,304)"><rect width="210" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="105" y="17" text-anchor="middle">admin question scheduling</text></g>
      <g transform="translate(280,304)"><rect width="126" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="63" y="17" text-anchor="middle">dataset import</text></g>
      <g transform="translate(418,304)"><rect width="133" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="66.5" y="17" text-anchor="middle">user management</text></g>
      <g transform="translate(563,304)"><rect width="210" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="105" y="17" text-anchor="middle">analytics &amp; streak resets</text></g>
      <g transform="translate(785,304)"><rect width="161" height="26" rx="13" fill="#141418" stroke="#2a2a30"/><text x="80.5" y="17" text-anchor="middle">content moderation</text></g>
    </g>

    <rect x="58" y="348" width="4" height="34" fill="#ff1f3d"/>
    <text x="74" y="362" font-size="12" fill="#9a9aa2"><tspan fill="#ff1f3d">BEST FEATURE</tspan> — admin question scheduling paired with</text>
    <text x="74" y="380" font-size="12" fill="#9a9aa2">streak maintenance, the two systems keeping it alive day to day.</text>
