<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Identity scan panel for Vinod M V">
  <defs>
    <clipPath id="photoClip"><rect x="70" y="45" width="290" height="290" rx="6"/></clipPath>
    <linearGradient id="photoScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff1f3d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridId" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="10" fill="#0b0b0e"/>
  <rect width="1200" height="380" rx="10" fill="url(#gridId)"/>

  <!-- radiating web threads from the photo panel corner, faint -->
  <g stroke="#ff1f3d" stroke-opacity="0.10" stroke-width="1">
    <line x1="215" y1="190" x2="10" y2="10"/>
    <line x1="215" y1="190" x2="420" y2="10"/>
    <line x1="215" y1="190" x2="10" y2="370"/>
    <line x1="215" y1="190" x2="420" y2="370"/>
    <path d="M60 60 Q215 100 400 60" fill="none"/>
    <path d="M40 190 Q215 220 420 190" fill="none"/>
    <path d="M60 320 Q215 280 400 320" fill="none"/>
  </g>

  <rect width="1200" height="380" rx="10" fill="none" stroke="#232329"/>

  <!-- photo panel -->
  <g>
    <rect x="66" y="41" width="298" height="298" rx="8" fill="none" stroke="#ff1f3d" stroke-opacity="0.55" stroke-width="1.5"/>
    <g clip-path="url(#photoClip)">
      <image href="vinod-photo.jpg" x="70" y="45" width="290" height="290" preserveAspectRatio="xMidYMid slice"/>
      <rect x="70" y="45" width="290" height="290" fill="#ff1f3d" opacity="0.05"/>
      <rect x="70" y="-40" width="290" height="60" fill="url(#photoScan)">
        <animate attributeName="y" values="-40;295" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- target-lock reticle, breathing -->
    <g stroke="#ff1f3d" fill="none">
      <circle cx="215" cy="190" r="150" stroke-opacity="0.35">
        <animate attributeName="r" values="150;160;150" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.4;0.15;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <line x1="215" y1="24" x2="215" y2="44" stroke-width="2"/>
      <line x1="215" y1="336" x2="215" y2="356" stroke-width="2"/>
      <line x1="49" y1="190" x2="69" y2="190" stroke-width="2"/>
      <line x1="361" y1="190" x2="381" y2="190" stroke-width="2"/>
    </g>

    <!-- corner marks -->
    <g stroke="#ff1f3d" stroke-width="2" fill="none">
      <path d="M60 60 V38 H82"/>
      <path d="M348 38 H370 V60"/>
      <path d="M60 320 V342 H82"/>
      <path d="M348 342 H370 V320"/>
    </g>
    <text x="70" y="356" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" letter-spacing="2" fill="#58585f">FIG. 01 — SUBJECT VISUAL, TARGET LOCKED</text>
  </g>

  <!-- data readout -->
  <g font-family="'JetBrains Mono',Consolas,monospace" fill="#e8e8ea">
    <text x="410" y="70" font-size="12.5" letter-spacing="3" fill="#ff1f3d">IDENTITY SCAN</text>
    <line x1="410" y1="84" x2="1140" y2="84" stroke="#232329"/>

    <g font-size="13.5">
      <text x="410" y="118"><tspan fill="#58585f">SUBJECT&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#f2f2f4" font-weight="600">VINOD M V</tspan></text>
      <text x="410" y="150"><tspan fill="#58585f">CLASSIFICATION&#160;&#160;</tspan><tspan fill="#f2f2f4">SOFTWARE ENGINEER • AI BUILDER</tspan></text>
      <text x="410" y="182"><tspan fill="#58585f">EDUCATION&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#f2f2f4">B.E. Information Science &amp; Engineering</tspan></text>
      <text x="410" y="214"><tspan fill="#58585f">INSTITUTION&#160;&#160;&#160;&#160;</tspan><tspan fill="#f2f2f4">Sir M. Visvesvaraya Institute of Technology</tspan></text>
      <text x="410" y="246"><tspan fill="#58585f">LOCATION&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#f2f2f4">Bengaluru, Karnataka, India</tspan></text>
      <text x="410" y="278"><tspan fill="#58585f">GRADUATION&#160;&#160;&#160;&#160;</tspan><tspan fill="#f2f2f4">2027</tspan></text>
      <text x="410" y="310"><tspan fill="#58585f">DIRECTIVE&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#f2f2f4">Build real software. Improve continuously.</tspan></text>
    </g>

    <g transform="translate(410,340)">
      <circle cx="0" cy="-4" r="4" fill="#21c979">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="14" y="0" font-size="12.5" letter-spacing="2" fill="#9a9aa2">STATUS: ONLINE</text>
    </g>
  </g>
</svg>
