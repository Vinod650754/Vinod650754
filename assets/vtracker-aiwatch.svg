<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI signal watch — where AI actually shows up across shipped projects">
  <defs>
    <pattern id="aiGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="10" fill="#0b0b0e"/>
  <rect width="1200" height="340" rx="10" fill="url(#aiGrid)"/>
  <rect width="1200" height="340" rx="10" fill="none" stroke="#232329"/>

  <g font-family="'JetBrains Mono',Consolas,monospace">
    <text x="40" y="46" font-size="13" letter-spacing="3" fill="#ff1f3d">AI SIGNAL WATCH</text>
    <text x="40" y="64" font-size="10.5" letter-spacing="1.5" fill="#58585f">AI AS IT SHOWS UP INSIDE SHIPPED APPLICATIONS — NOT A RESEARCH PROFILE</text>
    <line x1="40" y1="80" x2="1160" y2="80" stroke="#232329"/>

    <g font-size="12.5">
      <g transform="translate(0,116)">
        <rect x="40" y="-14" width="4" height="28" fill="#21c979"/>
        <circle cx="66" cy="0" r="5" fill="#21c979"/>
        <circle cx="66" cy="0" r="5" fill="none" stroke="#21c979"><animate attributeName="r" values="5;18;5" dur="2.6s" repeatCount="indefinite" begin="0s"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite" begin="0s"/></circle>
        <text x="88" y="4" fill="#e8e8ea">OpenAI / AI APIs</text>
        <text x="1160" y="4" text-anchor="end" fill="#21c979" font-weight="700">USED IN PROJECTS</text>
      </g>
      <g transform="translate(0,156)">
        <rect x="40" y="-14" width="4" height="28" fill="#21c979"/>
        <circle cx="66" cy="0" r="5" fill="#21c979"/>
        <circle cx="66" cy="0" r="5" fill="none" stroke="#21c979"><animate attributeName="r" values="5;18;5" dur="2.6s" repeatCount="indefinite" begin="0.4s"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite" begin="0.4s"/></circle>
        <text x="88" y="4" fill="#e8e8ea">AI-powered applications</text>
        <text x="1160" y="4" text-anchor="end" fill="#21c979" font-weight="700">ACTIVE</text>
      </g>
      <g transform="translate(0,196)">
        <rect x="40" y="-14" width="4" height="28" fill="#3aa0ff"/>
        <circle cx="66" cy="0" r="5" fill="#3aa0ff"/>
        <circle cx="66" cy="0" r="5" fill="none" stroke="#3aa0ff"><animate attributeName="r" values="5;18;5" dur="2.6s" repeatCount="indefinite" begin="0.8s"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite" begin="0.8s"/></circle>
        <text x="88" y="4" fill="#e8e8ea">AI-driven recommendations</text>
        <text x="1160" y="4" text-anchor="end" fill="#3aa0ff" font-weight="700">EXPERIMENTING</text>
      </g>
      <g transform="translate(0,236)">
        <rect x="40" y="-14" width="4" height="28" fill="#ffb020"/>
        <circle cx="66" cy="0" r="5" fill="#ffb020"/>
        <circle cx="66" cy="0" r="5" fill="none" stroke="#ffb020"><animate attributeName="r" values="5;18;5" dur="2.6s" repeatCount="indefinite" begin="1.2s"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite" begin="1.2s"/></circle>
        <text x="88" y="4" fill="#e8e8ea">Generative AI</text>
        <text x="1160" y="4" text-anchor="end" fill="#ffb020" font-weight="700">LEARNING</text>
      </g>
      <g transform="translate(0,276)">
        <rect x="40" y="-14" width="4" height="28" fill="#3aa0ff"/>
        <circle cx="66" cy="0" r="5" fill="#3aa0ff"/>
        <circle cx="66" cy="0" r="5" fill="none" stroke="#3aa0ff"><animate attributeName="r" values="5;18;5" dur="2.6s" repeatCount="indefinite" begin="1.6s"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite" begin="1.6s"/></circle>
        <text x="88" y="4" fill="#e8e8ea">LLM applications</text>
        <text x="1160" y="4" text-anchor="end" fill="#3aa0ff" font-weight="700">EXPLORING</text>
      </g>
