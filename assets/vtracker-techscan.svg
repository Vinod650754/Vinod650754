<svg viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technology scan in progress">
  <defs>
    <linearGradient id="tsScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff1f3d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="64" rx="8" fill="#0b0b0e"/>
  <rect width="1200" height="64" rx="8" fill="none" stroke="#232329"/>
  <rect x="-160" y="0" width="160" height="64" fill="url(#tsScan)">
    <animate attributeName="x" values="-160;1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <g font-family="'JetBrains Mono',Consolas,monospace">
    <text x="24" y="38" font-size="13" letter-spacing="3" fill="#ff1f3d">TECHNOLOGY SCAN</text>
    <text x="1176" y="38" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#58585f">READING SIGNATURE...</text>
  </g>
</svg>
